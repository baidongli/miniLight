name: Build apps

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding
        run: flutter create . --platforms=android --project-name minilight --org com.minilight
      - name: Inject native plugin + permissions
        run: bash scripts/inject_native_android.sh
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Stage APK
        run: |
          mkdir -p dist
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/minilight-${SAFE_REF}-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS scaffolding
        run: flutter create . --platforms=ios --project-name minilight --org com.minilight
      - name: Inject native plugin + permissions
        run: bash scripts/inject_native_ios.sh
      - name: Dependencies
        run: flutter pub get
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned .app
        run: |
          mkdir -p dist
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cd build/ios/iphoneos
          zip -r "$GITHUB_WORKSPACE/dist/minilight-ios-${SAFE_REF}-${{ github.run_number }}.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [android, ios]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: miniLight 0.0.1 build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            miniLight v0.0.1 — automated build from
            `${{ github.ref_name }}` @ ${{ github.sha }}.

            - Android: install the `.apk` (enable "unknown sources").
            - iOS: unsigned `Runner.app` zip (sideload / re-sign yourself).
          files: |
            artifacts/**/*.apk
            artifacts/**/*.zip

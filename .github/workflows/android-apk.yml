name: Build apps

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version bump
        run: bash scripts/check_version.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding
        run: flutter create . --platforms=android --project-name minilight --org com.minilight
      - name: Inject native plugin + permissions
        run: bash scripts/inject_native_android.sh
      - name: Configure release signing
        run: bash scripts/configure_android_signing.sh
      - name: Dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK (sideload)
        run: flutter build apk --release
      - name: Build App Bundle (Play)
        run: flutter build appbundle --release
      - name: Stage artifacts
        run: |
          mkdir -p dist
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/minilight-${SAFE_REF}-${{ github.run_number }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/minilight-${SAFE_REF}-${{ github.run_number }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload to Play (internal track)
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.minilight.minilight
          releaseFiles: dist/*.aab
          track: internal
          status: completed

  ios:
    runs-on: macos-14
    env:
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS scaffolding
        run: flutter create . --platforms=ios --project-name minilight --org com.minilight
      - name: Inject native plugin + permissions
        run: bash scripts/inject_native_ios.sh
      - name: Dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Build iOS (no codesign, sideload)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned .app
        run: |
          mkdir -p dist
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cd build/ios/iphoneos
          zip -r "$GITHUB_WORKSPACE/dist/minilight-ios-${SAFE_REF}-${{ github.run_number }}.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Configure App Store signing
        if: ${{ env.APPSTORE_API_KEY_ID != '' }}
        run: bash scripts/configure_ios_signing.sh
      - name: Archive, export & upload to TestFlight
        if: ${{ env.APPSTORE_API_KEY_ID != '' }}
        run: |
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" archive
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"
          xcrun altool --upload-app -f build/ipa/*.ipa -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

  release:
    needs: [android, ios]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Tag released version
        run: |
          V=$(grep -E '^version:' pubspec.yaml \
            | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "Tag v$V already exists — skipping."
          else
            git tag "v$V"
            git push origin "v$V"
            echo "Tagged v$V."
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: miniLight 0.0.1 build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            miniLight v0.0.1 — automated build from
            `${{ github.ref_name }}` @ ${{ github.sha }}.

            - Android: `.apk` for sideload; `.aab` is the Play upload.
            - iOS: unsigned `Runner.app` zip (sideload / re-sign).
              Signed TestFlight upload runs when App Store secrets are set.
          files: |
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.zip
